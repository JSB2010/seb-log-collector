name: Checks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      release_assets:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.18.0", cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: ShellCheck portable deployment wrapper
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0 deployment/deploy.sh deployment/enable-apis.sh
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.18.0" }
      - run: npm ci --ignore-scripts
      - run: npm run release:collector
      - name: zsh syntax and native tools
        run: |
          npm run check:collector
          node tests/macos-executables.mjs
          node tests/macos-installer.mjs
          node tests/macos-management.mjs
          /bin/zsh -f tests/macos-tools.zsh
          /bin/zsh -f tests/macos-collection.zsh
      - run: npm run verify:release
        env:
          RELEASE_TAG: ${{ inputs.release_assets && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release_assets }}
        with:
          name: collector-release-assets
          path: dist/collector/*/*
          if-no-files-found: error
          retention-days: 7
