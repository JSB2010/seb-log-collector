name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.18.0", cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: ShellCheck portable deployment wrapper
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0 deployment/deploy.sh deployment/enable-apis.sh
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.18.0" }
      - run: npm run release:collector
      - name: zsh syntax and native tools
        run: |
          for f in collector/soe-diagnostics collector/read-source collector/manage.zsh collector/management-worker.zsh collector/lib/*.zsh jamf/*.zsh jamf/releases/*.zsh public/collector/*.zsh; do /bin/zsh -n "$f"; done
          node tests/macos-executables.mjs
          node tests/macos-installer.mjs
          node tests/macos-management.mjs
          /bin/zsh -f tests/macos-tools.zsh
          /bin/zsh -f tests/macos-collection.zsh
      - name: Verify release checksums
        run: cd jamf/releases && shasum -a 256 -c SHA256SUMS
